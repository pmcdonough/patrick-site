<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Review</title>
<meta name="description" content="Shot versus pass review of a real NHL game, scored by expected goals, with a replay of the seconds around each shot.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=0.10">
</head>
<body>
<main>
  <div class="crumb"><a href="/">Patrick McDonough</a> &rsaquo; Play review</div>
  <h1 id="title">Play review</h1>
  <p class="sub" id="sub">Loading the game.</p>

  <div class="stats" id="stats"></div>

  <h2 id="scenarioTitle">Shots where a pass was worth more</h2>
  <div class="toggle" id="scenarios">
    <button type="button" data-sc="pass" aria-pressed="true">Pass worth more</button>
    <button type="button" data-sc="drive">Drive worth more</button>
    <button type="button" data-sc="right">Right call</button>
  </div>
  <div class="toggle" id="filters">
    <button type="button" data-team="" aria-pressed="true">Both teams</button>
    <button type="button" data-team="BOS">Bruins</button>
    <button type="button" data-team="MTL">Canadiens</button>
  </div>
  <div class="layout">
    <div class="list" id="list"></div>
    <div class="detail" id="detail"></div>
  </div>

  <details class="method"><summary>How this is scored</summary><div id="method"></div></details>

  <footer>Shot data from the NHL play-by-play and shift chart for this game. Expected goals from a model fit on MoneyPuck.com shot data (free for non-commercial use, credit MoneyPuck.com). <span id="version"></span></footer>
</main>

<script type="module" src="src/main.js?v=0.10"></script>
</body>
</html>
